name: Content Generation Pipeline

on:
  repository_dispatch:
    types: [content-generation-trigger]
  push:
    paths:
      - 'data/topics.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run content generation script
        id: generate
        run: |
          python scripts/generate-content.py

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated-content/ || true
          git commit -m "chore: generate content for new topics" || echo "No new content to commit"
          git push origin HEAD:main