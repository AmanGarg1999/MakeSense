version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: makesense
      POSTGRES_USER: makesense
      POSTGRES_PASSWORD: makesense_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makesense -d makesense"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8090:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://makesense:makesense_dev@db:5432/makesense
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
