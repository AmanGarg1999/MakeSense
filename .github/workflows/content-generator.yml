name: Content Generation Pipeline

on:
  repository_dispatch:
    types: [content-generation-trigger]
  push:
    paths:
      - 'data/topics.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run content generation script
        id: generate
        run: |
          python scripts/generate-content.py

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create staging branch
        id: branch
        run: |
          BRANCH_NAME="staging/content-generation-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          git checkout -b $BRANCH_NAME

      - name: Add generated content
        run: |
          git add generated-content/ || true
          git add data/topics.json || true

      - name: Commit changes
        run: |
          git commit -m "chore: generate content for new topics [skip ci]" || echo "No changes to commit"

      - name: Push branch
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
        run: |
          git push origin HEAD:$BRANCH_NAME

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.branch.outputs.branch_name }}
          base: main
          title: "chore: generate content for new topics"
          body: |
            This PR contains automatically generated content for new topic submissions.
            
            Please review and merge to publish.
          labels: ["automated", "content-generation"]
          assignees: ${{ github.actor }}