name: Weekly Analytics Report

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9:00 AM UTC
  workflow_dispatch:

jobs:
  update-analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Fetch all history to get proper commit status
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run analytics update script
        run: |
          python scripts/update_analytics.py

      - name: Configure Git user
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Commit and push changes
        run: |
          git add data/analytics.json reports/analytics-report.md
          # Check if there are changes to commit
          if ! git diff --cached --quiet; then
            git commit -m "chore: update analytics report [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi